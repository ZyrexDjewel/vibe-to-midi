services:
  web:
    build: .
    container_name: vibe_to_midi_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Mount source code for live hot-reloading during development
      - .:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s